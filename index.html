<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050810" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>BRIDGE // CRM Simulator</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #050810; overflow: hidden; }
      canvas { display: block; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #8fd3ff; font: 14px/1.5 "Consolas", "Menlo", monospace; letter-spacing: 0.08em; pointer-events: none;
        text-transform: uppercase; background: radial-gradient(circle at 50% 40%, #0b1a2e 0%, #050810 70%);
        transition: opacity 0.6s ease;
      }
      #boot h1 { font-size: 22px; margin: 0 0 8px; color: #e6f7ff; }
      #boot small { color: #4f7ea6; }
      #xr-button {
        position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 14px 32px;
        background: #0e2a45; color: #cfefff; border: 1px solid #3f8fc7; border-radius: 4px;
        font: 16px "Consolas", monospace; letter-spacing: 0.12em; cursor: pointer; z-index: 10;
      }
      #xr-button:disabled { opacity: 0.4; cursor: default; }
      #hint {
        position: fixed; left: 12px; bottom: 12px; color: #4f7ea6; font: 11px "Consolas", monospace;
        letter-spacing: 0.06em; opacity: 0.8; pointer-events: none; z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>BRIDGE // CRM SIMULATOR</h1>
      <div>Initialising local state engine</div>
      <small>offline · no network · verbal sync only</small>
    </div>
    <div id="hint">Desktop test mode: drag = look · click = interact · drag on dials/levers · keys 1-5 = quick role select</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
